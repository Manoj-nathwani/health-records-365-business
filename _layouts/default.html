<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description | strip_newlines }}">{% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      .site-nav {
        margin-bottom: 1.5rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #d0d7de;
        font-size: 14px;
      }
      .site-nav a { text-decoration: none; font-weight: 600; }
      .page-description { color: #57606a; margin-top: -0.5rem; }
      /* Wide tables scroll instead of overflowing the viewport on phones. */
      .markdown-body table { display: block; width: 100%; overflow-x: auto; }
      @media (min-width: 768px) {
        .markdown-body table { display: table; }
      }
    </style>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </nav>
      {{ content }}
    </div>
  </body>
</html>
